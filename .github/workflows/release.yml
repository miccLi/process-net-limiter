name: Build & Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable via build_exe.py
        run: |
          python build_exe.py

      - name: Archive Portable Distribution (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ProcessNetLimiter -DestinationPath dist\ProcessNetLimiter-Portable-x64.zip -Force

      - name: Set up Inno Setup Compiler
        uses: bcomnes/action-innosetup@v3

      - name: Compile Inno Setup Installer
        run: |
          iscc installer/setup.iss

      - name: Verify build artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path dist
          if (-not (Test-Path "dist\ProcessNetLimiter-Portable-x64.zip")) { throw "Portable ZIP not found!" }
          if (-not (Test-Path "dist\ProcessNetLimiter-Setup-x64.exe")) { throw "Setup EXE not found!" }

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ProcessNetLimiter-Portable-x64.zip
            dist/ProcessNetLimiter-Setup-x64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
